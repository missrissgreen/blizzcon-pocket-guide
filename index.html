<style>
:root {
  --bg-primary: #0a0e1a;
  --bg-secondary: #111827;
  --bg-card: #1a1f35;
  --bg-card-hover: #232945;
  --bg-surface: #0f1325;
  --text-primary: #f0f0f5;
  --text-secondary: #9ca3af;
  --text-muted: #6b7280;
  --border: #2a2f45;
  --border-light: #374151;

  --wow: #F1C428;
  --wow-bg: rgba(241,196,40,0.12);
  --diablo: #CC2200;
  --diablo-bg: rgba(204,34,0,0.12);
  --overwatch: #EE7E1F;
  --overwatch-bg: rgba(238,126,31,0.12);
  --hearthstone: #2CE6FF;
  --hearthstone-bg: rgba(44,230,255,0.12);
  --classic: #9B7FD4;
  --classic-bg: rgba(155,127,212,0.12);
  --blizzard: #009AE4;
  --blizzard-bg: rgba(0,154,228,0.12);
  --community: #E84393;
  --community-bg: rgba(232,67,147,0.12);
  --custom: #22C55E;
  --custom-bg: rgba(34,197,94,0.12);

  --star: #FFD700;
  --conflict: #ef4444;
  --live: #22c55e;
  --nav-height: 64px;
  --header-height: 52px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}


/* App Shell */
.app-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border);
  height: var(--header-height);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 8px; gap: 8px;
}
.app-header h1 {
  font-family: 'Rajdhani', 'Inter', sans-serif;
  font-size: 20px; font-weight: 700;
  background: linear-gradient(135deg, #009AE4 0%, #00d4ff 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; letter-spacing: 0.12em;
}
.app-header .header-btn {
  background: none; border: none; color: var(--text-secondary); cursor: pointer;
  padding: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}
.app-header .header-btn.active { color: var(--star); }
.header-search {
  display: none; flex: 1; min-width: 0;
  padding: 8px 12px; border-radius: 8px;
  background: var(--bg-secondary); border: 1px solid var(--border);
  color: var(--text-primary); font-size: 15px; font-family: inherit;
  outline: none;
}
.header-search::placeholder { color: var(--text-muted); }
.header-search:focus { border-color: var(--blizzard); }
.app-header.searching #headerTitle { display: none; }
.app-header.searching .header-search { display: block; }
.app-header.searching #searchBtn { color: var(--blizzard); }


.app-content {
  padding-top: var(--header-height);
  padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
  min-height: 100dvh;
}

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg-surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  height: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 4px;
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em;
  transition: color 0.2s;
}
.nav-item.active { color: #009AE4; }
.nav-item .nav-icon { font-size: 22px; line-height: 1; display: flex; align-items: center; justify-content: center; }

/* Filters */
.filters-bar {
  padding: 12px 16px 8px;
  display: flex; flex-direction: column; gap: 10px;
  background: var(--bg-primary);
  position: sticky; top: var(--header-height); z-index: 50;
}
.day-toggle {
  display: flex; background: var(--bg-secondary); border-radius: 10px;
  padding: 3px; gap: 2px;
}
.day-btn {
  flex: 1; padding: 10px 6px;
  background: none; border: none; border-radius: 8px;
  color: var(--text-secondary);
  font-family: 'Rajdhani', 'Inter', sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
  text-transform: uppercase; letter-spacing: 0.06em;
  white-space: nowrap;
}
.day-btn.active {
  background: #009AE4; color: white;
  box-shadow: 0 2px 8px rgba(0,154,228,0.3);
}
.filter-row {
  display: flex; gap: 8px; align-items: center;
}
.filter-toggle-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 10px;
  background: var(--bg-secondary); border: 1px solid var(--border);
  color: var(--text-secondary); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.filter-toggle-btn:active { transform: scale(0.97); }
.filter-toggle-btn.has-filters { border-color: rgba(0,154,228,0.4); color: var(--blizzard); background: rgba(0,154,228,0.1); }
.filter-toggle-btn .filter-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; border-radius: 9px;
  background: var(--blizzard); color: #fff; font-size: 11px; font-weight: 700;
  padding: 0 5px;
}
.filter-panel {
  display: none; flex-direction: column; gap: 12px;
  padding: 12px 16px 14px;
  background: var(--bg-primary); border-bottom: 1px solid var(--border);
  position: sticky; z-index: 49;
}
#scheduleFilterPanel { top: calc(var(--header-height) + var(--schedule-filters-height, 52px)); }
#myFilterPanel { top: calc(var(--header-height) + var(--my-filters-height, 52px)); }
#tab-schedule .time-label { top: calc(var(--header-height) + var(--schedule-filters-height, 52px) + var(--schedule-filters-height-panel, 0px)); }
#tab-my .time-label { top: calc(var(--header-height) + var(--my-filters-height, 52px) + var(--my-filters-height-panel, 0px)); }
.filter-panel.open { display: flex; }
.filter-panel-header {
  display: flex; justify-content: space-between; align-items: center;
}
.filter-panel-header span {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-secondary);
}
.filter-panel-header button {
  background: none; border: none; color: var(--blizzard);
  font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 0;
}
.filter-game-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
}
.filter-game-option {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px;
  background: var(--bg-secondary); border: 1.5px solid transparent;
  cursor: pointer; transition: all 0.15s;
}
.filter-game-option.checked { border-color: var(--border-light); background: var(--bg-tertiary, rgba(255,255,255,0.05)); }
.filter-game-checkbox {
  width: 18px; height: 18px; border-radius: 4px;
  border: 2px solid var(--border-light); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.filter-game-option.checked .filter-game-checkbox {
  border-color: currentColor; background: currentColor;
}
.filter-game-option.checked .filter-game-checkbox::after {
  content: ''; display: block; width: 5px; height: 9px;
  border: solid var(--bg-primary); border-width: 0 2px 2px 0;
  transform: rotate(45deg) translateY(-1px);
}
.filter-game-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.filter-game-name {
  font-size: 13px; font-weight: 600; color: var(--text-primary);
}
.filter-divider {
  height: 1px; background: var(--border); margin: 2px 0;
}
.filter-toggles {
  display: flex; gap: 8px;
}
.filter-toggle-option {
  flex: 1; display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px;
  background: var(--bg-secondary); border: 1.5px solid transparent;
  cursor: pointer; transition: all 0.15s; font-size: 13px; font-weight: 600;
  color: var(--text-primary);
}
.filter-toggle-option.checked { border-color: rgba(0,154,228,0.4); background: rgba(0,154,228,0.1); }
.filter-toggle-switch {
  width: 32px; height: 18px; border-radius: 9px;
  background: var(--border-light); flex-shrink: 0;
  position: relative; transition: background 0.15s;
}
.filter-toggle-switch::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; transition: transform 0.15s;
}
.filter-toggle-option.checked .filter-toggle-switch {
  background: var(--blizzard);
}
.filter-toggle-option.checked .filter-toggle-switch::after {
  transform: translateX(14px);
}



/* Time group */
.time-group { margin-bottom: 4px; }
.time-label {
  padding: 16px 16px 8px;
  font-family: 'Rajdhani', 'Inter', sans-serif;
  font-size: 14px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  position: sticky; z-index: 10;
  background: var(--bg-primary);
}

/* Session cards */
.session-card {
  margin: 4px 12px; padding: 14px 16px;
  background: var(--bg-card); border-radius: 12px;
  border-left: 3px solid var(--border);
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: flex-start; gap: 12px;
  position: relative;
}
.session-card:active { transform: scale(0.98); background: var(--bg-card-hover); }
.session-card.game-wow { border-left-color: var(--wow); }
.session-card.game-diablo { border-left-color: var(--diablo); }
.session-card.game-overwatch { border-left-color: var(--overwatch); }
.session-card.game-hearthstone { border-left-color: var(--hearthstone); }
.session-card.game-classic { border-left-color: var(--classic); }
.session-card.game-blizzard { border-left-color: var(--blizzard); }
.session-card.game-community { border-left-color: var(--community); }
.session-card.game-custom { border-left-color: var(--custom); }

.session-info { flex: 1; min-width: 0; }
.session-title {
  font-family: 'Rajdhani', 'Inter', sans-serif;
  font-size: 15px; font-weight: 700; line-height: 1.3;
  margin-bottom: 6px; color: var(--text-primary);
}
.session-meta {
  display: flex; flex-wrap: wrap; gap: 4px 12px;
  font-size: 12px; color: var(--text-secondary);
}
.session-meta span { display: flex; align-items: center; gap: 4px; }
.session-game-badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; margin-top: 6px;
}
.game-wow .session-game-badge { background: var(--wow-bg); color: var(--wow); }
.game-diablo .session-game-badge { background: var(--diablo-bg); color: var(--diablo); }
.game-overwatch .session-game-badge { background: var(--overwatch-bg); color: var(--overwatch); }
.game-hearthstone .session-game-badge { background: var(--hearthstone-bg); color: var(--hearthstone); }
.game-classic .session-game-badge { background: var(--classic-bg); color: var(--classic); }
.game-blizzard .session-game-badge { background: var(--blizzard-bg); color: var(--blizzard); }
.game-community .session-game-badge { background: var(--community-bg); color: var(--community); }
.game-custom .session-game-badge { background: var(--custom-bg); color: var(--custom); }

.star-btn {
  background: none; border: none; cursor: pointer;
  font-size: 22px; padding: 4px; flex-shrink: 0;
  color: var(--text-muted); transition: all 0.2s;
  line-height: 1;
}
.star-btn.starred { color: var(--star); transform: scale(1.1); }
.star-btn.must-do { color: #ff6b6b; transform: scale(1.15); filter: drop-shadow(0 0 4px rgba(255,107,107,0.4)); }
.star-btn:active { transform: scale(0.85); }

.live-indicator {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 700; color: var(--live);
  text-transform: uppercase;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--live); animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.conflict-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 700; color: var(--conflict);
  text-transform: uppercase; margin-top: 4px;
}

/* My Schedule empty state */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 32px; text-align: center;
  color: var(--text-muted);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-state h3 { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; }
.empty-state p { font-size: 14px; line-height: 1.5; }

/* Now & Next */
.now-next-section {
  padding: 16px; margin: 8px 12px;
  background: var(--bg-card); border-radius: 16px;
  border: 1px solid var(--border);
}
.now-next-section h2 {
  font-size: 13px; font-weight: 700; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
}
.countdown-display {
  text-align: center; padding: 24px 16px; margin: 8px 12px;
  background: linear-gradient(135deg, rgba(0,154,228,0.15) 0%, rgba(0,212,255,0.08) 100%);
  border: 1px solid rgba(0,154,228,0.2); border-radius: 16px;
}
.countdown-label {
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px;
}
.countdown-event {
  font-size: 16px; font-weight: 700; color: var(--text-primary);
  margin-bottom: 16px;
}
.countdown-timer {
  display: flex; justify-content: center; gap: 16px;
}
.countdown-unit {
  display: flex; flex-direction: column; align-items: center;
}
.countdown-number {
  font-family: 'Rajdhani', 'Inter', sans-serif;
  font-size: 40px; font-weight: 700; color: #009AE4;
  line-height: 1; font-variant-numeric: tabular-nums;
}
.countdown-suffix {
  font-size: 10px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; margin-top: 4px;
}

/* Detail modal */
.modal-backdrop {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 300;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  display: none; align-items: flex-end; justify-content: center;
}
.modal-backdrop.open { display: flex; }
.modal-sheet {
  background: var(--bg-secondary); border-radius: 20px 20px 0 0;
  width: 100%; max-width: 500px;
  max-height: 85dvh; overflow-y: auto;
  padding: 20px 20px calc(34px + env(safe-area-inset-bottom, 0px));
  animation: slideUp 0.25s ease-out;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-handle {
  width: 40px; height: 4px; border-radius: 2px;
  background: var(--border-light); margin: 0 auto 16px;
  cursor: pointer; padding: 10px 0; background-clip: content-box;
}
.modal-title { font-family: 'Rajdhani', 'Inter', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
.modal-meta {
  display: flex; flex-direction: column; gap: 8px;
  margin-bottom: 16px; font-size: 14px; color: var(--text-secondary);
}
.modal-meta span { display: flex; align-items: center; gap: 8px; }
.modal-desc {
  font-size: 14px; line-height: 1.6; color: var(--text-secondary);
  margin-bottom: 20px;
}
.modal-notes { margin-bottom: 16px; }
.modal-notes textarea {
  width: 100%; box-sizing: border-box; min-height: 60px; max-height: 150px;
  background: var(--bg-primary); color: var(--text-primary);
  border: 1px solid var(--border-light); border-radius: 10px;
  padding: 10px 12px; font-size: 16px; font-family: 'Inter', sans-serif;
  line-height: 1.5; resize: vertical;
}
.modal-notes textarea::placeholder { color: var(--text-muted); }
.modal-notes textarea:focus { outline: none; border-color: var(--blizzard); }
.modal-notes-label {
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
}
.note-indicator {
  font-size: 11px; color: var(--text-muted); margin-top: 4px;
  font-style: italic;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.modal-actions {
  display: flex; gap: 10px;
}
.modal-actions button {
  flex: 1; padding: 14px; border-radius: 12px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  border: none; transition: all 0.15s;
}
.modal-actions button:active { transform: scale(0.97); }
.btn-star {
  background: rgba(255,215,0,0.15); color: var(--star);
  border: 1px solid rgba(255,215,0,0.3) !important;
}
.btn-star.starred { background: var(--star); color: #1a1a1a; }
.btn-star.must-do { background: #ff6b6b; color: #fff; border-color: rgba(255,107,107,0.4) !important; }
.btn-close-modal {
  background: var(--bg-card); color: var(--text-secondary);
}

/* Notification toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-primary); padding: 12px 20px; border-radius: 12px;
  font-size: 13px; font-weight: 600; z-index: 400;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* Responsive - larger screens */
@media (min-width: 600px) {
  .app-content { max-width: 500px; margin: 0 auto; }
  .bottom-nav { justify-content: center; }
  .nav-item { max-width: 120px; }
}

/* Utility bar */
.util-bar {
  display: flex; gap: 8px; padding: 8px 16px 12px;
}
.util-btn {
  flex: 1; padding: 10px 12px; border-radius: 10px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg-secondary);
  color: var(--text-secondary); transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.util-btn:active { transform: scale(0.97); }
.util-btn.danger { border-color: rgba(239,68,68,0.3); color: var(--conflict); }
.util-btn.primary { border-color: rgba(34,197,94,0.3); color: var(--custom); }
.util-btn.active { background: rgba(0,154,228,0.15); border-color: rgba(0,154,228,0.4); color: var(--blizzard); }

.free-time-card {
  border-left: 3px dashed var(--border-light) !important;
  background: transparent;
  border: 1px dashed var(--border-light);
  cursor: default;
}
.free-time-card:active { transform: none; background: transparent; }
.free-time-card .session-title {
  color: var(--text-muted); font-weight: 600;
}
.free-time-card .free-duration {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; margin-top: 6px;
  background: rgba(107,114,128,0.15); color: var(--text-muted);
}

/* Custom event form */
.custom-form-backdrop {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 300;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  display: none; align-items: flex-end; justify-content: center;
}
.custom-form-backdrop.open { display: flex; }
.custom-form {
  background: var(--bg-secondary); border-radius: 20px 20px 0 0;
  width: 100%; max-width: 500px;
  max-height: 85dvh; overflow-y: auto;
  padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  animation: slideUp 0.25s ease-out;
}
.custom-form .modal-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--border-light); margin: 0 auto 16px; }
.custom-form h2 {
  font-family: 'Rajdhani', 'Inter', sans-serif;
  font-size: 20px; font-weight: 700; margin-bottom: 16px;
}
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.06em; margin-bottom: 6px;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-primary); font-size: 14px; font-family: inherit;
  outline: none; transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--custom);
}
.form-group textarea { resize: vertical; min-height: 60px; }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }
.form-actions { display: flex; gap: 10px; margin-top: 16px; }
.form-actions button {
  flex: 1; padding: 14px; border-radius: 12px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  border: none; transition: all 0.15s;
}
.form-actions button:active { transform: scale(0.97); }
.btn-save { background: var(--custom); color: #1a1a1a; }
.btn-cancel { background: var(--bg-card); color: var(--text-secondary); }

.app-footer {
  text-align: center; padding: 24px 16px 16px;
  font-size: 12px; color: var(--text-muted); line-height: 1.6;
}
.app-footer a {
  color: var(--blizzard); text-decoration: none; font-weight: 600;
}
.app-footer a:hover { text-decoration: underline; }

/* Utility */
.hidden { display: none !important; }

// ── Custom Events from localStorage ──
function loadCustomEvents() {
  try {
    const saved = localStorage.getItem('blizzcon-custom-events');
    return saved ? JSON.parse(saved) : [];
  } catch(e) { return []; }
}
function saveCustomEvents(events) {
  try { localStorage.setItem('blizzcon-custom-events', JSON.stringify(events)); } catch(e) {}
}

// ── Merge & Deduplicate ──
function buildSessionList() {
  const all = [...RAW_SESSIONS, ...COMMUNITY_EVENTS, ...loadCustomEvents()];
  const sessions = [];
  const seenIds = new Map();
  all.forEach(s => {
    const key = s.id + '|' + s.day;
    if (seenIds.has(key)) {
      const existing = seenIds.get(key);
      if (!existing._allStages) existing._allStages = [existing.stage + ' (' + existing.stageLocation + ')'];
      existing._allStages.push(s.stage + ' (' + s.stageLocation + ')');
    } else {
      const session = {...s, _uid: s.id + '|' + s.stage + '|' + s.day};
      seenIds.set(key, session);
      sessions.push(session);
    }
  });
  return sessions;
}

// ── Time formatting ──
const timeFmt = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit', hour12: true });
const dayTimeFmt = new Intl.DateTimeFormat(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit', hour12: true });

function formatTime(iso) { return timeFmt.format(new Date(iso)); }
function formatDayTime(iso) { return dayTimeFmt.format(new Date(iso)); }
function formatTimeRange(start, end) { return formatTime(start) + ' – ' + formatTime(end); }

function isLive(session) {
  const now = Date.now();
  return now >= new Date(session.startTime).getTime() && now < new Date(session.endTime).getTime();
}
function isPast(session) { return Date.now() >= new Date(session.endTime).getTime(); }
function timeUntil(iso) {
  const diff = new Date(iso).getTime() - Date.now();
  if (diff <= 0) return null;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  return { h, m, s, total: diff };
}

// ── Conflict detection ──
function getConflicts(uid) {
  const session = SESSIONS.find(s => s._uid === uid);
  if (!session) return [];
  const start = new Date(session.startTime).getTime();
  const end = new Date(session.endTime).getTime();
  return SESSIONS.filter(s =>
    s._uid !== uid && state.favorites.has(s._uid) &&
    new Date(s.startTime).getTime() < end && new Date(s.endTime).getTime() > start
  );
}

function renderSchedule() {

  const searchQuery = (document.getElementById('headerSearch')?.value || '').toLowerCase().trim();

    if (state.day !== 'all' && s.day !== state.day) return false;
    if (state.gameFilters.size > 0 && !state.gameFilters.has(s.game)) return false;
    if (searchQuery && !s.title.toLowerCase().includes(searchQuery) && !s.description.toLowerCase().includes(searchQuery) && !s.stage.toLowerCase().includes(searchQuery) && !s.game.toLowerCase().includes(searchQuery)) return false;
    return true;
  }).sort((a, b) => new Date(a.startTime) - new Date(b.startTime));

  const container = document.getElementById('scheduleList');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">\u{1F50D}</div><h3>No events found</h3><p>Try changing your filters</p></div>';

function calcFreeBlocks(dayFilter, priorityFilter) {
  const allFavs = SESSIONS.filter(s => {
      if (!state.favorites.has(s._uid)) return false;
      if (priorityFilter === 'mustdo' && !state.mustDos.has(s._uid)) return false;
      if (priorityFilter === 'favorites' && state.mustDos.has(s._uid)) return false;
      return true;
    })
    .filter(s => dayFilter === 'all' || s.day === dayFilter)
    .sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
  const blocks = [];
  const openTime = { saturday: '2026-09-12T16:00:00.000Z', sunday: '2026-09-13T16:00:00.000Z' };
  const closeTime = { saturday: '2026-09-13T02:00:00.000Z', sunday: '2026-09-14T02:00:00.000Z' };
  ['saturday', 'sunday'].forEach(day => {
    const daySessions = allFavs.filter(s => s.day === day);
    if (daySessions.length < 1) return;
    const firstStart = new Date(daySessions[0].startTime).getTime();
    const open = new Date(openTime[day]).getTime();
    if (firstStart > open) {
      const mins = Math.round((firstStart - open) / 60000);
      if (mins >= 15) {
        blocks.push({
          _isFreeTime: true,
          startTime: openTime[day],
          endTime: daySessions[0].startTime,
          day, duration: mins
        });
      }
    }
    let latestEnd = new Date(daySessions[0].endTime).getTime();
    for (let i = 1; i < daySessions.length; i++) {
      const start = new Date(daySessions[i].startTime).getTime();
      const end = new Date(daySessions[i].endTime).getTime();
      if (start > latestEnd) {
        const mins = Math.round((start - latestEnd) / 60000);
        if (mins >= 15) {
          blocks.push({
            _isFreeTime: true,
            startTime: new Date(latestEnd).toISOString(),
            endTime: daySessions[i].startTime,
            day, duration: mins
          });
        }
      }
      if (end > latestEnd) latestEnd = end;
    }
    const close = new Date(closeTime[day]).getTime();
    if (latestEnd < close) {
      const mins = Math.round((close - latestEnd) / 60000);
      if (mins >= 15) {
        blocks.push({
          _isFreeTime: true,
          startTime: new Date(latestEnd).toISOString(),
          endTime: closeTime[day],
          day, duration: mins
        });
      }
    }
  });
  return blocks;
}

function renderFreeCard(block) {

  const mins = block.duration % 60;
  const dur = hrs > 0 ? hrs + 'h' + (mins > 0 ? ' ' + mins + 'm' : '') : mins + 'm';
  return `<div class="session-card free-time-card">
    <div class="session-info">
      <div class="session-title">Free Time</div>
      <div class="session-meta">
        <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px;"><path d="m12 6v6l4 2m6-2c0 5.5228-4.4772 10-10 10-5.52285 0-10-4.4772-10-10 0-5.52285 4.47715-10 10-10 5.5228 0 10 4.47715 10 10z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg> ${formatTimeRange(block.startTime, block.endTime)}</span>
      </div>
      <span class="free-duration">${dur} free</span>
    </div>
  </div>`;
}

  if (favSessions.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none"><path d="m11.2827 3.45332c.2304-.46694.3457-.70041.5021-.77501.1361-.0649.2943-.0649.4304 0 .1565.0746.2717.30807.5022.77501l2.1867 4.42996c.068.13785.102.20678.1517.2603.0441.04738.0969.08577.1555.11304.0663.0308.1423.04192.2944.06415l4.8913.71494c.5151.07528.7726.11292.8918.23873.1037.10945.1524.25986.1327.40933-.0227.17181-.2091.35343-.582.71663l-3.5381 3.446c-.1102.1074-.1654.1612-.201.2251-.0315.0565-.0517.1187-.0595.183-.0088.0726.0042.1485.0302.3002l.8349 4.8674c.088.5134.132.7701.0493.9224-.072.1325-.1999.2255-.3482.253-.1705.0316-.401-.0897-.862-.3321l-4.3727-2.2996c-.1363-.0716-.2044-.1074-.2762-.1215-.0635-.0125-.1289-.0125-.1924 0-.0718.0141-.1399.0499-.2761.1215l-4.37278 2.2996c-.461.2424-.69151.3637-.86195.3321-.14829-.0275-.27625-.1205-.34823-.253-.08274-.1523-.03871-.409.04933-.9224l.83482-4.8674c.02602-.1517.03904-.2276.03023-.3002-.0078-.0643-.02801-.1265-.05951-.183-.03559-.0639-.09073-.1177-.20102-.2251l-3.53803-3.446c-.3729-.3632-.55935-.54482-.58203-.71663-.01974-.14947.02902-.29988.13272-.40933.11919-.12581.37672-.16345.89179-.23873l4.89127-.71494c.15211-.02223.22817-.03335.29441-.06415.05864-.02727.11144-.06566.15547-.11304.04972-.05352.08374-.12245.15178-.2603z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg></div>
      <h3>No favorites yet</h3>
      <p>Tap the star on any event to add it to your personal schedule. Or add a custom event to keep track of guild meet-ups, cosplay photoshoots, community events, medication reminders, nudges to drink water... Literally whatever you want.</p>
    </div>`;
    return;
  }

  const freeBlocks = state.showFreeTime ? calcFreeBlocks(state.myDay, state.mustDoOnly ? 'mustdo' : 'all') : [];
  const items = [...favSessions.map(s => ({...s})), ...freeBlocks]
    .sort((a, b) => new Date(a.startTime) - new Date(b.startTime));

  const groups = new Map();
  items.forEach(s => {
    const dayPrefix = state.myDay === 'all' ? (s.day === 'saturday' ? 'Saturday · ' : 'Sunday · ') : '';
    const key = dayPrefix + formatTime(s.startTime);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  });

  let html = '';
  groups.forEach((sessions, time) => {
    html += `<div class="time-group"><div class="time-label">${time}</div>`;
    sessions.forEach(s => html += s._isFreeTime ? renderFreeCard(s) : renderCard(s));
    html += '</div>';
  });
  container.innerHTML = html;

}

// ── Now & Next ──
function renderNowNext() {
  const now = Date.now();
  const favSessions = SESSIONS.filter(s => state.favorites.has(s._uid))
    .sort((a, b) => new Date(a.startTime) - new Date(b.startTime));

  const liveFavs = favSessions.filter(s => isLive(s));
  const upcomingFavs = favSessions.filter(s => new Date(s.startTime).getTime() > now);
  const nextFav = upcomingFavs[0];

  const liveAll = SESSIONS.filter(s => isLive(s));

  let html = '';

  // Countdown to next favorited event
  if (nextFav) {
    const until = timeUntil(nextFav.startTime);
    html += `<div class="countdown-display">
      <div class="countdown-label">Next in your schedule</div>
      <div class="countdown-event">${nextFav.title}</div>
      <div class="countdown-timer">
        ${until.h > 0 ? `<div class="countdown-unit"><span class="countdown-number">${until.h}</span><span class="countdown-suffix">hr</span></div>` : ''}
        <div class="countdown-unit"><span class="countdown-number">${String(until.m).padStart(2, '0')}</span><span class="countdown-suffix">min</span></div>
        <div class="countdown-unit"><span class="countdown-number">${String(until.s).padStart(2, '0')}</span><span class="countdown-suffix">sec</span></div>
      </div>
      <div style="margin-top:12px; font-size:12px; color:var(--text-muted);">${formatDayTime(nextFav.startTime)} · ${nextFav.stage}</div>
    </div>`;
  }

  // Your live events
  if (liveFavs.length > 0) {
    html += `<div class="now-next-section"><h2><span class="live-dot"></span> Happening Now (Your Schedule)</h2>`;
    liveFavs.forEach(s => html += renderCard(s));
    html += '</div>';
  }

  // All live events
  if (liveAll.length > 0) {
    html += `<div class="now-next-section"><h2><span class="live-dot"></span> All Live Events</h2>`;
    liveAll.forEach(s => html += renderCard(s));
    html += '</div>';
  }

  // Upcoming favorites
  if (upcomingFavs.length > 0) {
    html += `<div class="now-next-section"><h2>Coming Up (Your Schedule)</h2>`;
    upcomingFavs.slice(0, 5).forEach(s => html += renderCard(s));
    html += '</div>';
  }

  if (!html) {
    const allUpcoming = SESSIONS.filter(s => new Date(s.startTime).getTime() > now)
      .sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
    if (allUpcoming.length > 0) {
      const untilNext = timeUntil(allUpcoming[0].startTime);
      html += `<div class="countdown-display">
        <div class="countdown-label">Next Event</div>
        <div class="countdown-event">${allUpcoming[0].title}</div>
        ${untilNext ? `<div class="countdown-timer">
          ${untilNext.h > 0 ? `<div class="countdown-unit"><span class="countdown-number">${untilNext.h}</span><span class="countdown-suffix">hr</span></div>` : ''}
          <div class="countdown-unit"><span class="countdown-number">${String(untilNext.m).padStart(2, '0')}</span><span class="countdown-suffix">min</span></div>
          <div class="countdown-unit"><span class="countdown-number">${String(untilNext.s).padStart(2, '0')}</span><span class="countdown-suffix">sec</span></div>
        </div>` : ''}
        <div style="margin-top:12px; font-size:12px; color:var(--text-muted);">${formatDayTime(allUpcoming[0].startTime)} · ${allUpcoming[0].stage}</div>
      </div>`;
      html += `<div class="now-next-section"><h2>Coming Up Next</h2>`;
      allUpcoming.slice(0, 6).forEach(s => html += renderCard(s));
      html += '</div>';
    } else {
      html = `<div class="empty-state">
        <div class="empty-icon">\u{1F389}</div>
        <h3>BlizzCon has ended!</h3>
        <p>Hope you had an amazing time. See you next year!</p>
      </div>`;
    }
  }

  document.getElementById('nowNextContent').innerHTML = html;
}

// ── Favorites ──
const _demoted = new Set();
function toggleFavorite(uid) {
  if (state.mustDos.has(uid)) {
    state.mustDos.delete(uid);
    _demoted.add(uid);
  } else if (state.favorites.has(uid)) {
    if (_demoted.has(uid)) {
      state.favorites.delete(uid);
      _demoted.delete(uid);
      clearNotificationTimer(uid);
    } else {
      state.mustDos.add(uid);
    }
  } else {
    _demoted.delete(uid);
    state.favorites.add(uid);
    scheduleNotification(uid);
    try {
      if (!localStorage.getItem('blizzcon-mustdo-hint')) {
        localStorage.setItem('blizzcon-mustdo-hint', '1');
        showToast('Tap the star again to mark as Must Do');
      }
    } catch(e) {}
  }
  saveFavorites();
  saveMustDos();

  if (state.tab === 'schedule') renderSchedule();
  else if (state.tab === 'my') renderMySchedule();
  else if (state.tab === 'now') renderNowNext();
}

function clearAllFavorites() {
  if (state.favorites.size === 0) { showToast('No favorites to clear'); return; }
  if (!confirm('Clear all favorites?')) return;
  Object.keys(state.notificationTimers).forEach(clearNotificationTimer);
  state.favorites.clear();
  state.mustDos.clear();
  saveFavorites();
  saveMustDos();
  renderMySchedule();
  showToast('All favorites cleared');
}

// ── Custom Events ──
function openCustomForm(editId) {
  if (editId) {
    const events = loadCustomEvents();
    const ev = events.find(e => e.id === editId);
    if (ev) {
      document.getElementById('customTitle').value = ev.title;
      document.getElementById('customDay').value = ev.day;
      const startLocal = new Date(ev.startTime);
      const endLocal = new Date(ev.endTime);
      document.getElementById('customStart').value = startLocal.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit',hour12:false});
      document.getElementById('customEnd').value = endLocal.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit',hour12:false});
      document.getElementById('customLocation').value = ev.stage || '';
      document.getElementById('customNotes').value = ev.description || '';
      document.getElementById('customFormBackdrop').dataset.editId = editId;
    }
  } else {
    document.getElementById('customTitle').value = '';
    document.getElementById('customDay').value = 'saturday';
    document.getElementById('customStart').value = '12:00';
    document.getElementById('customEnd').value = '13:00';
    document.getElementById('customLocation').value = '';
    document.getElementById('customNotes').value = '';
    delete document.getElementById('customFormBackdrop').dataset.editId;
  }
  document.querySelector('.custom-form h2').textContent = editId ? 'Edit Custom Event' : 'Add Custom Event';
  document.getElementById('customFormBackdrop').classList.add('open');
  document.getElementById('customTitle').focus();
}

function closeCustomForm() {
  document.getElementById('customFormBackdrop').classList.remove('open');
}

function saveCustomEvent() {
  const title = document.getElementById('customTitle').value.trim();
  if (!title) { showToast('Please enter an event name'); return; }
  const day = document.getElementById('customDay').value;
  const startTime = document.getElementById('customStart').value;
  const endTime = document.getElementById('customEnd').value;
  const location = document.getElementById('customLocation').value.trim();
  const notes = document.getElementById('customNotes').value.trim();

  if (endTime <= startTime) { showToast('End time must be after start time'); return; }
  const dateStr = day === 'saturday' ? '2026-09-12' : '2026-09-13';
  const startISO = new Date(dateStr + 'T' + startTime + ':00').toISOString();
  const endISO = new Date(dateStr + 'T' + endTime + ':00').toISOString();

  const editId = document.getElementById('customFormBackdrop').dataset.editId;
  const events = loadCustomEvents();

  if (editId) {
    const oldSession = SESSIONS.find(s => s.id === editId);
    const oldUid = oldSession ? oldSession._uid : null;
    const idx = events.findIndex(e => e.id === editId);
    if (idx >= 0) {
      events[idx] = { ...events[idx], title, day, startTime: startISO, endTime: endISO, stageLocation: '', stage: location || 'Custom', description: notes, dayLabel: day === 'saturday' ? '12 Sep Saturday' : '13 Sep Sunday' };
    }
    saveCustomEvents(events);
    SESSIONS = buildSessionList();
    if (oldUid && state.favorites.has(oldUid)) {
      state.favorites.delete(oldUid);
      const newSession = SESSIONS.find(s => s.id === editId);
      if (newSession) state.favorites.add(newSession._uid);
      saveFavorites();
    }
  } else {
    const id = 'custom-' + Date.now();
    events.push({
      id, title, description: notes, startTime: startISO, endTime: endISO,
      game: 'Custom', streamUrl: '', vodUrl: '',
      stage: location || 'Custom', stageLocation: '',
      day, dayLabel: day === 'saturday' ? '12 Sep Saturday' : '13 Sep Sunday'
    });
    saveCustomEvents(events);
    SESSIONS = buildSessionList();
    const newSession = SESSIONS.find(s => s.id === id);
    if (newSession) {
      state.favorites.add(newSession._uid);
      saveFavorites();
    }
  }
  closeCustomForm();
  switchTab('my');
  showToast(editId ? 'Event updated' : 'Event added to your schedule');
}

function deleteCustomEvent(id) {
  if (!confirm('Delete this event?')) return;
  const events = loadCustomEvents().filter(e => e.id !== id);
  saveCustomEvents(events);
  const session = SESSIONS.find(s => s.id === id);
  if (session) state.favorites.delete(session._uid);
  saveFavorites();
  SESSIONS = buildSessionList();
  closeModal();
  if (state.tab === 'schedule') renderSchedule();
  else if (state.tab === 'my') renderMySchedule();
  else if (state.tab === 'now') renderNowNext();
  showToast('Event deleted');
}

// ── Detail Modal ──
function openDetail(uid) {
  const session = SESSIONS.find(s => s._uid === uid);
  if (!session) return;
  const starred = state.favorites.has(uid);
  const isMustDo = state.mustDos.has(uid);
  const conflicts = starred ? getConflicts(uid) : [];
  const stageLabel = session._allStages ? 'Simulcast — All Stages' : session.stage + ' · ' + session.stageLocation;

  document.getElementById('modalSheet').innerHTML = `
    <div class="modal-handle" onclick="closeModal()"></div>
    <span class="session-game-badge" style="margin-bottom:12px; display:inline-block;">${GAME_LABELS[session.game] || session.game}</span>
    <h2 class="modal-title">${esc(session.title)}</h2>
    <div class="modal-meta">
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px;"><path d="m21 10h-18m13-8v4m-8-4v4m-.2 16h8.4c1.6802 0 2.5202 0 3.162-.327.5645-.2876 1.0234-.7465 1.311-1.311.327-.6418.327-1.4818.327-3.162v-8.4c0-1.68016 0-2.52024-.327-3.16197-.2876-.56449-.7465-1.02343-1.311-1.31105-.6418-.32698-1.4818-.32698-3.162-.32698h-8.4c-1.68016 0-2.52024 0-3.16197.32698-.56449.28762-1.02343.74656-1.31105 1.31105-.32698.64173-.32698 1.48181-.32698 3.16197v8.4c0 1.6802 0 2.5202.32698 3.162.28762.5645.74656 1.0234 1.31105 1.311.64173.327 1.48181.327 3.16197.327z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg> ${session.day === 'saturday' ? 'Saturday, September 12' : 'Sunday, September 13'}</span>
      <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px;"><path d="m12 6v6l4 2m6-2c0 5.5228-4.4772 10-10 10-5.52285 0-10-4.4772-10-10 0-5.52285 4.47715-10 10-10 5.5228 0 10 4.47715 10 10z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg> ${formatTimeRange(session.startTime, session.endTime)}</span>
      <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px;"><g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m12 13c1.6569 0 3-1.3431 3-3 0-1.65685-1.3431-3-3-3s-3 1.34315-3 3c0 1.6569 1.3431 3 3 3z"/><path d="m12 22c4-4 8-7.5817 8-12 0-4.41828-3.5817-8-8-8-4.41828 0-8 3.58172-8 8 0 4.4183 4 8 8 12z"/></g></svg> ${esc(stageLabel)}</span>
      ${session._allStages ? '<span style="font-size:12px; color:var(--text-muted);">' + esc(session._allStages.join(' · ')) + '</span>' : ''}
    </div>
    ${session.description ? `<p class="modal-desc">${esc(session.description)}</p>` : '<p class="modal-desc" style="color:var(--text-muted); font-style:italic;">No description available.</p>'}
    ${conflicts.length ? `<div style="background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); border-radius:10px; padding:12px; margin-bottom:16px; font-size:13px;">
      <strong style="color:var(--conflict);">⚠️ Schedule Conflict</strong><br>
      <span style="color:var(--text-secondary);">Overlaps with: ${esc(conflicts.map(c => c.title).join(', '))}</span>
    </div>` : ''}
    <div class="modal-notes">
      <div class="modal-notes-label">My Notes</div>
      <textarea id="modalNoteInput" placeholder="Add a personal note..." onblur="saveNote('${uid}', this.value); if(state.tab==='schedule')renderSchedule(); else if(state.tab==='my')renderMySchedule(); else if(state.tab==='now')renderNowNext();">${esc(state.notes[uid] || '')}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-star ${isMustDo ? 'must-do' : starred ? 'starred' : ''}" onclick="toggleFavorite('${uid}'); openDetail('${uid}');">
        ${isMustDo ? '★ Must Do' : starred ? '★ In My Schedule' : '☆ Add to Schedule'}
      </button>
      ${session.id.startsWith('custom-') ? `<button class="btn-close-modal" onclick="closeModal(); openCustomForm('${session.id}')">Edit</button><button class="btn-close-modal" style="color:var(--conflict);" onclick="deleteCustomEvent('${session.id}')">Delete</button>` : ''}
      <button class="btn-close-modal" onclick="closeModal()">Close</button>
    </div>`;
  document.getElementById('modalBackdrop').classList.add('open');
  document.getElementById('modalNoteInput').addEventListener('focus', function() {
    setTimeout(() => this.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
  });
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalBackdrop')) return;
  document.getElementById('modalBackdrop').classList.remove('open');
}

// ── Search ──
function toggleSearch() {
  const header = document.querySelector('.app-header');
  const input = document.getElementById('headerSearch');
  if (header.classList.contains('searching')) {
    header.classList.remove('searching');
    input.value = '';
    renderSchedule();
  } else {
    header.classList.add('searching');
    input.focus();
  }
}

function handleInlineSearch() {
  renderSchedule();
}

// ── Notifications ──
function toggleNotifications() {
  if (!('Notification' in window)) {
    showToast('Notifications not supported in this browser');
    return;
  }
  if (state.notificationsEnabled) {
    state.notificationsEnabled = false;
    Object.keys(state.notificationTimers).forEach(clearNotificationTimer);
    document.getElementById('notifyBtn').classList.remove('active');
    showToast('Notifications disabled');
    return;
  }
  Notification.requestPermission().then(perm => {
    if (perm === 'granted') {
      state.notificationsEnabled = true;
      document.getElementById('notifyBtn').classList.add('active');
      state.favorites.forEach(uid => scheduleNotification(uid));
      showToast('Notifications enabled! You\'ll get alerts 15 min before events');
    } else {
      showToast('Please allow notifications in your browser settings');
    }
  });
}

function scheduleNotification(uid) {
  if (!state.notificationsEnabled) return;
  const session = SESSIONS.find(s => s._uid === uid);
  if (!session) return;
  const alertTime = new Date(session.startTime).getTime() - 15 * 60000;
  const delay = alertTime - Date.now();
  if (delay <= 0) return;
  clearNotificationTimer(uid);
  state.notificationTimers[uid] = setTimeout(() => {
    new Notification('BlizzCon Pocket Guide', {
      body: `${session.title} starts in 15 minutes!\n${session.stage} · ${session.stageLocation}`,
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">⚔️</text></svg>'
    });
  }, delay);
}

function clearNotificationTimer(uid) {
  if (state.notificationTimers[uid]) {
    clearTimeout(state.notificationTimers[uid]);
    delete state.notificationTimers[uid];
  }
}

// ── Toast ──
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Live update timer ──
let liveTimer;
function startLiveUpdates() {
  if (liveTimer) clearInterval(liveTimer);
  liveTimer = setInterval(() => {
    if (state.tab === 'now') renderNowNext();
  }, 1000);
}

// ── Init ──
loadFavorites();
loadMustDos();
loadNotes();
renderSchedule();
startLiveUpdates();

// Re-schedule notifications for existing favorites on load
if ('Notification' in window && Notification.permission === 'granted') {
  state.notificationsEnabled = true;
  document.getElementById('notifyBtn').classList.add('active');
  state.favorites.forEach(uid => scheduleNotification(uid));
}

// Handle escape key for modals
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.querySelector('.app-header').classList.contains('searching')) toggleSearch();
    else if (document.getElementById('customFormBackdrop').classList.contains('open')) closeCustomForm();
    else if (document.getElementById('modalBackdrop').classList.contains('open')) closeModal();
  }
});
</script>
